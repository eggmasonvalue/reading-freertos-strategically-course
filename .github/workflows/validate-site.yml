name: Validate public site

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Run navigation regression tests
        run: python -m unittest discover -s tests -v
      - name: Validate static site
        run: python scripts/check-site.py
